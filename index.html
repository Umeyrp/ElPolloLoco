<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="img/3_enemies_chicken/chicken_small/1_walk/1_w.png">
    <title>ElPolloLoco</title>
</head>

<body>
    <h1>El pollo loco</h1>
    <div class="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div id="startscreen">
            <img src="./img/9_intro_outro_screens/start/startscreen_1.png" class="game_screens" alt="Startscreen">
            <div class="menu">
                <button onclick="startGame()">Start Game</button>
                <button onclick="showControls()">Controls</button>
                <a href="./impressum.html">
                    <button>Imprint</button>
                </a>
            </div>
        </div>
        <div id="winscreen" hidden>
            <img src="./img/You won, you lost/You Win A.png" class="game_screens" alt="WinScreen">
            <div class="end-menu">
                <button onclick="restartGame()">Restart</button>
                <button onclick="goHome()">Home</button>
            </div>
        </div>

        <div id="gameoverscreen" hidden>
            <img src="./img/You won, you lost/Game over A.png" class="game_screens" alt="GameOverScreen">
            <div class="end-menu">
                <button onclick="restartGame()">Restart</button>
                <button onclick="goHome()">Home</button>
            </div>
        </div>
        <button id="muteButton" onclick="toggleMute()">
            <img id="muteIcon" src="./img/volume-mute.png" alt="Sound">
        </button>
    </div>
</body>
<script src="./classes/drawable-object.class.js"></script>
<script src="./classes/movable-object.class.js"></script>
<script src="./classes/status-bar.class.js"></script>
<script src="./classes/healthBar.class.js"></script>
<script src="./classes/coinBar.class.js"></script>
<script src="./classes/bottleBar.class.js"></script>
<script src="./classes/chicken.class.js"></script>
<script src="./classes/chick.class.js"></script>
<script src="./classes/endboss.class.js"></script>
<script src="./classes/character.class.js"></script>
<script src="./classes/cloud.class.js"></script>
<script src="./classes/world.class.js"></script>
<script src="./classes/background-object.class.js"></script>
<script src="./classes/keyboard.class.js"></script>
<script src="./classes/level.class.js"></script>
<script src="./classes/throwable-object.class.js"></script>
<script src="./classes/collectableObjects.class.js"></script>
<script src="./classes/coin.class.js"></script>
<script src="./classes/bottle.class.js"></script>
<script src="./levels/level1.js"></script>
<script src="./classes/sound.class.js"></script>
<script src="./js/settings.js"></script>
<script src="./js/game.js"></script>

</html>
